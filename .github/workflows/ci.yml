name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/backend/.cache/numba
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint (ruff)
        run: |
          uv run ruff check src/
          uv run ruff format --check src/ tests/
      - name: Type check (ty)
        run: uvx ty check src/
      - name: Tests (includes openapi.json staleness and circular imports)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: API types are generated from backend/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: Type check and build
        run: npm run build
